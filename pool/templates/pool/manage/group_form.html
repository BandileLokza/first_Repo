{% extends "pool/manage/base.html" %}

{% block manager_title %}{{ page_title }} · {{ competition.name }}{% endblock %}

{% block manager_content %}
<section class="pool-manager-panel pool-manager-form-panel">
    <p class="pool-eyebrow">{{ stage.name }}</p>
    <h2>{{ page_title }}</h2>
    <form method="post" class="pool-manager-form" novalidate>
        {% csrf_token %}
        {% include "pool/manage/_form_fields.html" with form=form %}
        <div class="pool-manager-actions"><button class="btn btn-primary" type="submit">Save group</button><a class="btn btn-outline-secondary" href="{% url 'pool:manage_competition_group_stage' competition.slug stage.pk %}">Cancel</a></div>
    </form>
</section>
{% endblock %}
